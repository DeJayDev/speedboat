name: speedboat

services:
  web:
    build: .
    command: python manage.py serve -r
    volumes:
      - .:/opt/rowboat
    ports:
      - "8686:8686"
  bot:
    build: .
    command: /opt/poetry/bin/poetry poe bot --env prod
    volumes:
      - .:/opt/rowboat
    depends_on:
      - web
  workers:
    build: .
    command: python manage.py workers
    volumes:
      - .:/opt/rowboat
    depends_on:
      - web
